[dataset.rt_x]
file = rtbse_x/Results/Cysteine-POL-1.dat
filetype = cols
parser-args = 1 3

[dataset.rt_y]
file = rtbse_y/Results/Cysteine-POL-1.dat
filetype = cols
parser-args = 1 3

[dataset.rt_z]
file = rtbse_z/Results/Cysteine-POL-1.dat
filetype = cols
parser-args = 1 3

[dataset.bse]
file = bse/Results_narrow/BSE-ABBA-eta=0.010.spectrum
filetype = cols
parser-args = 0 1

[data]
combine = sum rt_pol_sum rt_x 1 rt_y 1 rt_z 1
	scale rt_pol rt_pol_sum 0 0.33333

[plot]
type = line
cols = bse 0 bse 1
	rt_x 0 rt_pol 0
labels = LR-BSE
	RT-BSE
linestyleCycle = - -- -- --
colorCycle = r g b c
# fit = lorentz_peak 2
# 	lorentz_peak 1
# fit-xmin = 5.0
# 	9.0
# fit-xmax = 7.0
# 	11.0
# fit-labels = Fit, $\delta \parallel y/z$
# 	Fit, $\delta \parallel x$
# fit-colorCycle = c m
ylabel = Polarizability
xlabel = Energy [eV]
xlim = 0 12
ylim = 0 200
figfile = spectrum.pdf
	spectrum.svg
