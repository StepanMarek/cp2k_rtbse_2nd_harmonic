[dataset.e_x_1e2]
file = e_x/Results/CO-POL-1.dat
filetype = cols
parser-args = 1 3

[plot]
type = line
cols = e_x_1e2 0 e_x_1e2 1
labels = $\vec{E} \parallel x$
