[dataset.field]
file = CO-FIELD-1.dat
filetype = cols
parser-args = 0 1

[data]
combine = fft --fold_around 374 --coord field 0 field_ft field 1
	scale field_ft_energy field_ft 0 4.135

[plot]
type = line
cols = field_ft_energy 0 field_ft 1
	field_ft_energy 0 field_ft 2
labels = Re
	Im
xlim = 0 20
figfile = field_ft.pdf
