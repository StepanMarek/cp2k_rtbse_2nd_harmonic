[dataset.moments]
file = CO-MOMENTS-1_SPIN_A_RE.dat
filetype = cols
parser-args = 0 1

[data]
combine = translate moments_t moments 1 0.18772141E-001
	map-exponential --offset 374 --rate 0.2 moments_w moments 0
	product moments_ww moments_w 1 moments_t 0

[plot]
type = line
cols = moments 0 moments_t 0
	moments 0 moments_ww 0
colorCycle = b g
labels = Moments
xlim = 0 44
twinx = field.cfg
figfile = moments.pdf
