[dataset.rt_x]
file = rtbse_x/Results/CO-POL-1.dat
filetype = cols
parser-args = 1 3

[dataset.rt_y]
file = rtbse_y/Results/CO-POL-1.dat
filetype = cols
parser-args = 1 3

[dataset.rt_z]
file = rtbse_z/Results/CO-POL-1.dat
filetype = cols
parser-args = 1 3

[data]
combine = sum rt_pol_sum rt_x 1 rt_y 1 rt_z 1
	scale rt_pol rt_pol_sum 0 0.33333

[plot]
type = line
cols = rt_x 0 rt_pol 0
	rt_x 0 rt_x 1
	rt_y 0 rt_y 1
labels = Full
	$\delta \parallel x$
	$\delta \parallel y/z$
linestyleCycle = - -- --
colorCycle = r g b
fit = lorentz_peak 2
	lorentz_peak 1
fit-xmin = 5.0
	9.0
fit-xmax = 7.0
	11.0
fit-labels = Fit, $\delta \parallel y/z$
	Fit, $\delta \parallel x$
fit-colorCycle = c m
ylabel = Polarizability
xlabel = Energy [eV]
xlim = 0 20
ylim = 0 150
figfile = spectrum.pdf
	spectrum.svg
